<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MITRA Interface</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true">
<defs>
<filter id="iron-sketch">
<feColorMatrix type="matrix" values="0.2 0.5 0.5 0 0  0.25 0.7 0.6 0 0.08  0.35 0.75 0.8 0 0.12  0 0 0 1 0"></feColorMatrix>
</filter>
<filter id="iron-edge" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="1.1" result="soft"></feGaussianBlur>
<feComposite in="SourceGraphic" in2="soft" operator="arithmetic" k1="1.4" k2="-1.1" k3="0.25" k4="0"></feComposite>
<feColorMatrix type="matrix" values="0.25 0.55 0.55 0 0.02  0.3 0.8 0.7 0 0.1  0.4 0.85 0.9 0 0.14  0 0 0 1 0"></feColorMatrix>
</filter>
</defs>
</svg>
<div id="boot">
  <div class="boot-box">
    <div class="boot-title">MITRA</div>
    <div id="boot-lines"></div>
  </div>
</div>
<header id="topbar">
  <div class="brand">MITRA <span class="brand-sub">INTERFACE</span></div>
  <div class="project-box">
    <label for="project">PROJECT</label>
    <input id="project" value="default" maxlength="40" autocomplete="off" spellcheck="false">
  </div>
  <div class="clock-box"><span id="clock">00:00:00</span><span id="date"></span></div>
  <div class="toggles">
    <button id="voice-toggle" class="pill on" type="button">VOICE ON</button>
    <button id="sound-toggle" class="pill on" type="button">SOUND ON</button>
    <button id="autostart-toggle" class="pill" type="button">AUTOSTART OFF</button>
  </div>
</header>
<main id="grid">
  <aside id="left">
    <section class="panel">
      <h2>CONNECTORS</h2>
      <div id="connectors"></div>
    </section>
    <section class="panel">
      <h2>SYSTEM</h2>
      <dl id="system-list"></dl>
    </section>
    <section class="panel grow">
      <h2>TASKS</h2>
      <ul id="task-list"></ul>
      <div class="row">
        <input id="task-input" placeholder="New task" maxlength="120" autocomplete="off">
        <button id="task-add" type="button">ADD</button>
      </div>
    </section>
  </aside>
  <section id="center">
    <div id="reactor-wrap">
      <canvas id="reactor"></canvas>
      <div id="avatar-core">
        <svg id="orbit-text" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <path id="orbit-path" d="M 100,100 m -78,0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0"></path>
          </defs>
          <text><textPath href="#orbit-path" id="orbit-words">JAYA PRAKASH MEREPALA + DALLAS TEXAS + PALNI INC + SALESFORCE CONSULTANT + </textPath></text>
        </svg>
        <div id="avatar-ring">
          <img id="avatar-img" src="/avatar.jpg" alt="Operator portrait in Iron Man outline style">
        </div>
      </div>
      <div id="reactor-caption"><span id="persona-line">Systems nominal.</span></div>
    </div>
    <div id="voicebar">
      <label for="persona-select">PERSONA</label>
      <select id="persona-select" title="Voice persona">
        <option value="auto">AUTO</option>
        <option value="jarvis">JARVIS</option>
        <option value="friday">FRIDAY</option>
      </select>
      <label for="voice-select">VOICE</label>
      <select id="voice-select" title="Voice"></select>
      <label for="rate">PACE</label>
      <input id="rate" type="range" min="0.8" max="1.2" step="0.01" value="0.98">
      <label for="pitch">TONE</label>
      <input id="pitch" type="range" min="0.8" max="1.2" step="0.01" value="1">
      <button id="voice-test" type="button">TEST</button>
    </div>
    <div id="transcript" aria-live="polite"></div>
    <div id="composer">
      <button id="mic" type="button" title="Voice input">MIC</button>
      <input id="input" placeholder="Talk to Mitra" autocomplete="off" maxlength="2000">
      <button id="send" type="button">SEND</button>
    </div>
  </section>
  <aside id="right">
    <section class="panel">
      <h2>BRIEFING</h2>
      <div id="briefing"></div>
    </section>
    <section class="panel grow">
      <h2>APPROVALS</h2>
      <div id="approvals"></div>
    </section>
    <section class="panel grow">
      <h2>MEMORY</h2>
      <div id="memory"></div>
      <button id="memory-refresh" type="button">REFRESH</button>
    </section>
  </aside>
</main>
<script src="/app.js"></script>
</body>
</html>
