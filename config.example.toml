# Copy to config.toml and adjust. No secrets in this file.
# Secrets come from the environment only. See .env.example.

[provider]
# One of: mock, ollama, openai_compat
name = "mock"
model = "mock-echo"
# Used by ollama and openai_compat.
base_url = "http://localhost:11434"
# Timeout in seconds for model calls.
timeout_seconds = 30

[memory]
# SQLite path. Relative paths resolve from the project directory.
db_path = "mitra.db"
# Optional vector recall. One of: off, ollama. Needs an embedding model:
# ollama pull nomic-embed-text. Failures fall back to keyword recall.
embeddings = "off"
embed_model = "nomic-embed-text"
embed_base_url = "http://localhost:11434"

[tools]
# Directories the file tools may touch. Keep this narrow.
allowed_dirs = ["."]
# Optional host allowlist for fetch_url. Empty means any public host.
# Private and local addresses are always blocked.
fetch_allowed_hosts = []
# Hosts allowed to resolve private addresses. Use for LAN services only.
fetch_private_hosts = []

[api]
host = "127.0.0.1"
port = 8931

[approvals]
# Pending proposals expire after this many seconds.
ttl_seconds = 3600
# Decided and expired proposals older than this are purged.
retain_days = 30

[shell]
# Disabled by default. Enable only with a narrow allowlist.
enabled = false
allowlist = ["ls", "pwd", "echo"]
timeout_seconds = 30
max_output_chars = 20000
# Setting deny_regexes replaces the built in denylist (recursive delete,
# disk writes, and similar patterns). Leave unset to keep the defaults.
# Optional per command flag rules. A listed command accepts only these flags.
# [shell.flag_rules]
# git = ["status", "log", "--oneline"]

[speech]
# One of: silent, say (macOS speech for terminal voice output).
# voice: any installed macOS voice, or auto to let the persona choose.
# persona: auto, jarvis (measured, Daniel first), friday (warm, Moira first).
# Premium and Siri voices sound most natural; download them in
# System Settings, then restart the terminal.
backend = "silent"
voice = "Samantha"
rate = 190
persona = "auto"

[orchestrator]
# Model driven planning for multi step requests. Needs a reasoning
# provider; the mock and failed plans fall back to plain chat.
planning = true

[speech_to_text]
# One of: stub, faster_whisper. Stub keeps tests deterministic.
# faster_whisper needs: pip install faster-whisper, plus a model
# download on first use (tiny, base, small, medium, large).
engine = "stub"
model = "base"
max_mb = 10

# MCP servers over stdio. Each server spawns per call. Trust "read"
# runs tools directly; trust "staged" (default) stages an approval
# proposal per call. List tools with: mcp <server> <tool>.
# [mcp.servers.notes]
# command = "python3"
# args = ["/path/to/notes_mcp.py"]
# trust = "staged"

# Per project profiles. Each section overrides base settings for that project.
# Supported keys: provider, model, allowed_dirs, shell_enabled.
[profiles.CancerLens]
provider = "mock"
model = "mock-echo"
allowed_dirs = ["."]
shell_enabled = false
